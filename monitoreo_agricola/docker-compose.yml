services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitoreo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitoreo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/monitoreo
    depends_on:
      postgres:
        condition: service_healthy

  simulador:
    build: .
    command: python sensor_mock.py
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/monitoreo
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

volumes:
  pgdata:
