<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Panel de monitoreo agrícola en tiempo real para Rincón Verde. Visualiza temperatura, humedad y CO2 de tus fincas.">
    <title>Rincón Verde — Monitoreo Agrícola</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">

</head>

<body>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <div class="app-container">

        <!-- Header -->
        <header class="header">
            <div class="header-brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M7 20h10" />
                        <path d="M10 20c5.5-2.5.8-6.4 3-10" />
                        <path
                            d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z" />
                        <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z" />
                    </svg>
                </div>
                <div>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div class="brand-title">Rincón Verde</div>
                        <div id="ws-badge" class="connection-badge offline">
                            <span class="status-dot"></span>
                            <span id="ws-status-text">Desconectado</span>
                        </div>
                    </div>
                    <div class="brand-subtitle">Monitoreo Agrícola en Tiempo Real</div>
                </div>
            </div>
        </header>

        <!-- Finca Cards -->
        <section class="fincas-grid" id="fincas-grid"></section>

        <!-- Chart Section -->
        <section class="chart-section" id="chart-section">
            <div class="chart-header">
                <div>
                    <div class="chart-title">Tendencia en tiempo real</div>
                    <div class="chart-subtitle">Evolución de las últimas lecturas y su relación con los umbrales de alerta</div>
                </div>
                <div class="chart-controls">
                    <div class="pill-group" id="chart-metrics" role="group" aria-label="Métrica">
                        <button class="pill active" data-metric="temperatura">Temperatura</button>
                        <button class="pill" data-metric="humedad">Humedad</button>
                        <button class="pill" data-metric="co2">CO₂</button>
                    </div>
                    <select id="chart-finca" class="chart-select" aria-label="Finca"></select>
                </div>
            </div>
            <div class="chart-canvas-wrap"><canvas id="trend-chart"></canvas></div>
            <p class="chart-summary" id="chart-summary">Esperando datos…</p>
        </section>

        <!-- History Section -->
        <section class="history-section">
            <div class="history-header">
                <div class="history-header-left">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                    </svg>
                    <div>
                        <div class="history-title">Historial de Lecturas</div>
                        <div class="history-subtitle">Últimos 50 registros por finca</div>
                    </div>
                </div>
            </div>
            <div class="history-columns" id="history-columns"></div>
        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
